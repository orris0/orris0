name: Build and deploy MkDocs site
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  repository_dispatch:
    types: [rebuild-site]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install mkdocs and deps
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs==1.5.2

      - name: Fetch README files and write docs pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p docs
          repos=(
            "orris0/orris0"
            "orris0/Creating-a-website"
            "orris0/css-secrets"
            "orris0/jQuery-novice-to-ninja"
          )
          for r in "${repos[@]}"; do
            owner=$(echo "$r" | cut -d'/' -f1)
            repo=$(echo "$r" | cut -d'/' -f2)

            echo "Fetching README for $r"
            # Use raw media type to get raw markdown
            resp=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3.raw" "https://api.github.com/repos/$owner/$repo/readme")
            if [ -z "$resp" ]; then
              echo "No README for $r, creating placeholder."
              cat > "docs/${repo}.md" <<'EOF'
This page is generated from the repository README.md by the site build workflow.

(README not found)
EOF
            else
              echo "$resp" > "docs/${repo}.md"
            fi
          done

      - name: Build site with mkdocs
        run: |
          mkdocs build --site-dir site

      - name: Deploy to orris0.github.io
        if: ${{ secrets.PUBLISH_PAT != '' }}
        env:
          PUBLISH_PAT: ${{ secrets.PUBLISH_PAT }}
        run: |
          set -e
          PUBLISH_REPO="orris0/orris0.github.io"
          TARGET_BRANCH="main"
          TMPDIR=$(mktemp -d)
          echo "Preparing publish repo $PUBLISH_REPO in $TMPDIR"

          # Try to clone; if the repo is empty or doesn't exist yet, init a new git repo
          if git ls-remote "https://x-access-token:${PUBLISH_PAT}@github.com/${PUBLISH_REPO}.git" >/dev/null 2>&1; then
            git clone --depth=1 "https://x-access-token:${PUBLISH_PAT}@github.com/${PUBLISH_REPO}.git" "$TMPDIR" || (
              git clone "https://x-access-token:${PUBLISH_PAT}@github.com/${PUBLISH_REPO}.git" "$TMPDIR" || true
            )
          else
            mkdir -p "$TMPDIR"
            cd "$TMPDIR"
            git init
            git remote add origin "https://x-access-token:${PUBLISH_PAT}@github.com/${PUBLISH_REPO}.git"
          fi

          # Clear and copy site output
          rm -rf "$TMPDIR"/*
          cp -R site/* "$TMPDIR"/
          cd "$TMPDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish site: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" || echo "No changes to commit"
          git push origin HEAD:${TARGET_BRANCH} --force

      - name: Warn about missing PUBLISH_PAT
        if: ${{ secrets.PUBLISH_PAT == '' }}
        run: |
          echo "PUBLISH_PAT secret not set in this repository. To publish to orris0.github.io, add a repository secret named PUBLISH_PAT with a PAT that can push to orris0/orris0.github.io. The workflow built the site locally but did not publish it."
